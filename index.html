<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Tracker</title>

    <!-- font Awesome  -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- favIcon  -->
    <link rel="shortcut icon" href="/assets/logo.png" type="image/x-icon" />

    <!-- tailwind and daisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>


</head>

<body class="max-w-[1000px] mx-auto p-[40px] bg-slate-200">

    <h1 class=" text-4xl text-sky-900 font-bold">Job Application Tracker</h1> <br>

    <div class="counter grid grid-cols-3 gap-6">
        <div class="Total p-[20px] shadow-md rounded-lg bg-base-200">
            <h1 class="text-xl  text-sky-900 font-semibold">Total</h1> <br>
            <p id="total-count" class="font-bold text-sky-900 text-3xl">0</p>
        </div>
        <div class="Total p-[20px] shadow-md rounded-lg bg-base-200">
            <h1 class="font-semibold text-xl  text-sky-900">Interview</h1> <br>
            <p id="interview-count" class="font-bold text-green-500 text-3xl ">0</p>
        </div>
        <div class="Total p-[20px] shadow-md rounded-lg bg-base-200">
            <h1 class=" font-semibold text-xl  text-sky-900">Rejected</h1> <br>
            <p id="reject-count" class="font-bold text-red-500 text-3xl">0</p>
        </div>
    </div>

    <div class="flex justify-between items-center pt-4">
        <h1 class="font-semibold text-xl text-sky-900">Available Jobs</h1>
        <span id="tab-count" class="text-sky-900/90 text-sm">8 jobs</span>
    </div>

    <div class="max-w-[270px] grid grid-cols-3 pt-6">


        <button id="all-btn"
            class="tab-button active-tab  py-2 bg-base-200 text-center bg-base-200 rounded-md text-sky-900"
            onclick="filterTab('ALL','all-btn')">All</button>



        <button id="interview-btn" class="tab-button py-2 bg-base-200 text-center bg-base-200 rounded-md text-sky-900"
            onclick="filterTab('INTERVIEW','interview-btn')">Interview</button>




        <button id="reject-btn" class=" tab-button py-2 bg-base-200 text-center bg-base-200 rounded-md text-sky-900"
            onclick="filterTab('REJECTED','reject-btn')">Rejected</button>


    </div> <br>

    <div id="Container" class="max-w-[1000px] flex flex-col gap-4"></div>

    <script>


        let jobArray = [
            {
                Count: 1,
                Name: "Mobile First Corp",
                Title: "React Native Developer",
                Location: "Remote",
                Time: "Full-time",
                Salary: "$130,000 - $175,000",
                State: "Not Applied",
                Description: "Build cross-platform mobile applications using React Native. Work on products used by millions of users worldwide."

            },
            {
                Count: 2,
                Name: "WebFlow Agency",
                Title: "Web Designer & Developer",
                Location: "Los Angeles, CA",
                Time: "Part-time",
                Salary: "$80,000 - $120,000",
                State: "Not Applied",
                Description: "Create stunning web experiences for high-profile clients. Must have portfolio and experience with modern web design trends."

            },
            {
                Count: 3,
                Name: "DataViz Solutions",
                Title: "Data Visualization Specialist",
                Location: "Boston, MA",
                Time: "Full-time",
                Salary: "$125,000 - $165,000",
                State: "Not Applied",
                Description: "Transform complex data into compelling visualizations. Required skills: D3.js, React, and strong analytical thinking."

            },
            {
                Count: 4,
                Name: "CloudFirst Inc",
                Title: "Backend Developer",
                Location: "Seattle, WA",
                Time: "Full-time",
                Salary: "$140,000 - $190,000",
                State: "Not Applied",
                Description: "Design and maintain scalable backend systems using Python and AWS. Work with modern DevOps practices and cloud infrastructure."

            },
            {
                Count: 5,
                Name: "Innovation Labs",
                Title: "UI/UX Engineer",
                Location: "Austin, TX",
                Time: "Full-time",
                Salary: " $110,000 - $150,000",
                State: "Not Applied",
                Description: "Create beautiful and functional user interfaces for our suite of products. Strong design skills and frontend development expertise required."

            },
            {
                Count: 6,
                Name: "MegaCorp Solutions",
                Title: "JavaScript Developer",
                Location: "New York, NY",
                Time: "Full-time",
                Salary: "$130,000 - $170,00",
                State: "Not Applied",
                Description: "Build enterprise applications with JavaScript and modern frameworks. We offer competitive compensation, health insurance, and professional development opportunities."

            },
            {
                Count: 7,
                Name: "StartupXYZ",
                Title: "Full Stack Engineer",
                Location: "Remote",
                Time: "Full-time",
                Salary: "$130,000 - $175,000",
                State: "Not Applied",
                Description: "Join our fast-growing startup and work on our core platform. Experience with Node.js and React required. Great benefits and equity package included."

            },
            {
                Count: 8,
                Name: "TechCorp Industries",
                Title: "Senior Frontend Developer",
                Location: "San Francisco, CA",
                Time: "Full-time",
                Salary: "$130,000 - $175,000",
                State: "Not Applied",
                Description: "We are looking for an experienced Frontend Developer to build scalable web applications using React and TypeScript. You will work with a talented team on cutting-edge projects."

            },


        ]


        function renderJobs(jobList) {


            const container = document.getElementById('Container')

            container.innerHTML = ''

            for (const card of jobList) {

                const cards = document.createElement('div')


                cards.innerHTML
                    =
                    `<div class="relative rounded-2xl border border-blue-400/50 border-[3px]rounded-lg bg-base-200 p-[30px]">

                    <button onclick="delBtn(${card.Count})" class="absolute right-5 z-10 hover:text-red-400 text-gray-400 transition-all active:scale-70"><i class="fa-solid fa-trash"></i></button>
                    
                    <h1 class="text-xl font-semibold text-sky-900">${card.Name}</h1> 

                    <p class="text-sm font-neutral text-sky-900/80 pb-1">${card.Title}</p> 

                    <div class='gap-4 flex'>
                        <p class="py-1 px-3 rounded-lg bg-blue-200  text-[10px] font-neutral text-sky-900/60">${card.Location}</p> <span class="text-sky-800/70 ">•</span>

                        <p class="py-1 px-3 rounded-lg bg-blue-200  text-[10px] font-neutral text-sky-900/60">${card.Time}</p> <span class="text-sky-800/70 ">•</span>

                        <p class="py-1 px-3 rounded-lg bg-blue-200  text-[10px] font-neutral text-sky-900">${card.Salary}</p>

                    </div> <br>

                    <h1 class=" max-w-23 py-1 px-3 rounded-lg bg-blue-200 text-[11px] text-neutral uppercase mb-1 text-center ${stateBg}">${card.State}</h1>

                    <p class="font-normal text-[13px] text-sky-900/90">${card.Description}</p>

                    <div class="flex gap-4 pt-4">


                        <button onclick="changeState(${card.Count},'INTERVIEW')" class="${interFill} max-w-26 py-1 px-3 rounded-lg  text-[13px]  uppercase font-medium border border-[1px] border-green-700/60">INTERVIEW</button>
                        

                        <button onclick="changeState(${card.Count},'REJECTED')" class="${rejectFill} max-w-26 py-1 px-3 rounded-lg  text-[13px]  uppercase font-medium border border-[1px] border-red-700/60">REJECTED</button>
                        
                        
                        
                        </div>



                </div>`


                container.appendChild(cards)

            };



        }

        function counter() {

            let totalCount = jobArray.length
            let interviewCount = jobArray.filter(job => job.State === 'INTERVIEW').length
            let rejectCount = jobArray.filter(job => job.State === 'REJECTED').length

            document.getElementById('total-count').innerHTML = totalCount
            document.getElementById('interview-count').innerHTML = interviewCount
            document.getElementById('reject-count').innerHTML = rejectCount



        }

        function changeState(count, newState) {


            for (const job of jobArray) {

                if (job.Count === count) {

                    if (job.State === newState) {

                        job.State = 'Not Applied'
                    }
                    else {

                        job.State = newState

                    }
                }
            }

            renderJobs(jobArray)

            counter()

            document.getElementById('tab-count').innerHTML = `${jobArray.length} jobs`

        }




        function filterTab(status, targetId) {


            const allTabButton = document.querySelectorAll('.tab-button')

            for (const button of allTabButton) {

                button.classList.remove('bg-blue-500', 'text-white')


            }
            const targetBtn = document.getElementById(targetId)

            targetBtn.classList.add('bg-blue-500', 'text-white')


            if (status === 'ALL') {

                renderJobs(jobArray)


                document.getElementById('tab-count').innerHTML = `${jobArray.length} jobs`
            }
            else {
                const filteredJobs = jobArray.filter(job => job.State === status)

                renderJobs(filteredJobs)


                document.getElementById('tab-count').innerHTML = `${filteredJobs.length} jobs`

            }
        }


        function delBtn(count) {

            jobArray = jobArray.filter(job => job.Count !== count)

            renderJobs(jobArray)

            counter()



            document.getElementById('tab-count').innerHTML = `${jobArray.length} jobs`

        }




        renderJobs(jobArray)
        counter()

        document.getElementById('tab-count').innerHTML = `${jobArray.length} jobs`


    </script>
